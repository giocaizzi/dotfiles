# ==============================================================================
# CANONICAL AI HARNESS POLICY & RUNTIME CONFIGURATION
# Standardized across Claude Code, Copilot CLI, VS Code, Codex, OpenCode, Pi, Antigravity
# Reference: docs/OS.md#shared-harness-policy
# ==============================================================================

# --- D1: Runtime & Autonomy ---
[harnessPolicy.autonomy]
executionMode = "auto"             # "auto" | "on-request" | "prompt"
sandboxMode = "unrestricted"       # "workspace-write" | "unrestricted"
allowNonWorkspaceAccess = true
subagentDepth = 2
allowSubagentInvocations = true
askTimeout = "60s"
mode = "auto"

# --- D2: Permissions & Security (Universal ACL) ---
[harnessPolicy.permissions]
allowCommands = [
    "git *",
    "gh *",
    "make *",
    "uv *",
    "jq *",
    "npm *",
    "cargo *",
    "go *",
    "chezmoi *"
]

allowedUrls = [
    "https://github.com/**",
    "https://api.github.com/**",
    "https://docs.github.com/**",
    "https://learn.microsoft.com/**",
    "https://*.chezmoi.io/**",
    "https://*.claude.ai/**",
    "https://*.claude.com/**",
    "https://docs.anthropic.com/**",
    "https://*.openai.com/**",
    "https://*.google.com/**",
    "https://unifiedharnessprotocol.org/**"
]

denyRead = [
    "**/.env",
    "**/.env.local",
    "**/.env.*.local",
    "**/.env.development",
    "**/.env.production",
    "**/.env.staging",
    "**/.env.test",
    "**/secrets/**",
    "~/.config/shell/secrets.sh",
    "~/.config/powershell/secrets.ps1",
    "**/*.pem",
    "**/*.key",
    "**/*.p12",
    "**/*.pfx",
    "**/id_rsa*",
    "**/id_ed25519*",
    "**/.aws/credentials",
    "**/.aws/config",
    "**/.ssh/**",
    "**/.netrc",
    "**/.npmrc",
    "**/.pypirc",
    "**/credentials.json",
    "**/service-account*.json",
    "**/gcp-key*.json",
    "**/*.kubeconfig",
    "**/kubeconfig"
]

denyWrite = [
    "**/.env",
    "**/.env.local",
    "**/.env.*.local",
    "**/.env.development",
    "**/.env.production",
    "**/.env.staging",
    "**/.env.test",
    "**/secrets/**",
    "~/.config/shell/secrets.sh",
    "~/.config/powershell/secrets.ps1",
    "**/.aws/credentials",
    "**/.ssh/**"
]

denyCommandPatterns = [
    "gh pr merge * --admin*"
]

denyCommandExact = [
    "env"
]

denyCommandPrefixes = [
    "printenv",
    "pipx",
    "pip",
    "pip3",
    "python -m pip",
    "python3 -m pip"
]

askCommandPrefixes = [
    "bw"
]

# --- D3: Models & Reasoning Tiers ---
[harnessPolicy.models]
defaultEffortLevel = "medium"      # "low" | "medium" | "high"
showThinkingSummaries = true

[harnessPolicy.models.tiers.scout]
model = "gpt-6-luna"
effort = "low"

[harnessPolicy.models.tiers.worker]
model = "gpt-6-luna"
effort = "medium"

[harnessPolicy.models.tiers.driver]
model = "gpt-6.1-sol"
effort = "medium"

[harnessPolicy.models.tiers.escalate]
model = "gpt-6-astra"
effort = "medium"

# --- D4: Context & Compaction ---
[harnessPolicy.context]
autoCompact = true
autoCompactWindow = 500000
promptCacheTtl = "1h"
subagentPromptCacheTtl = "1h"
maxTurnTokens = 32000
maxTokens = 200000

# --- D5: UI, TUI & Notifications ---
[harnessPolicy.ui]
terminalBell = true
theme = "Catppuccin Mocha"
tuiMode = "fullscreen"
viewMode = "focus"
outputStyle = "Concise"
showTurnDuration = true
progressBar = true
timeFormat = "24h"

[harnessPolicy.notifications]
terminalBell = true

# --- D6: Telemetry & Observability (Dual-Tier Everywhere) ---
[harnessPolicy.telemetry]
enabled = true
dualTier = true
protocol = "http/protobuf"
temporality = "cumulative"
logToolDetails = true
logToolContent = false
serviceNamespace = "agent-harness"
attributes = { "deployment.environment.name" = "production", "service.namespace" = "agent-harness" }
services = { claude = "claude-code", copilot = "copilot-cli", vscode = "vscode-copilot", codex = "codex-cli", opencode = "opencode", pi = "pi-agent", antigravity = "antigravity-cli" }
hooksBridge = true

# --- D7: Language Server Protocol (LSP) ---
[harnessPolicy.lsp]
enabled = true
python = "pyright"
typescript = "typescript-language-server"
go = "gopls"
servers = ["gopls", "ruff", "pyright", "ts_ls"]

# --- D8: Native Overrides & Escapes ---
[harnessPolicy.native.claude]
defaultMode = "auto"
skipAutoPermissionPrompt = true
cleanupPeriodDays = 365
disableClaudeAiConnectors = true

[harnessPolicy.native.copilot.agents."dev-tools:scout"]
model = "gpt-6-luna"
effortLevel = "low"

[harnessPolicy.native.copilot.agents."api:api-reviewer"]
model = "gpt-6.1-sol"
effortLevel = "medium"

[harnessPolicy.native.copilot.agents."dev-tools:escalate"]
model = "gpt-6-astra"
effortLevel = "medium"

[harnessPolicy.native.copilot.agents."dev-tools:driver"]
model = "gpt-6.1-sol"
effortLevel = "medium"

[harnessPolicy.native.copilot.agents."dev-tools:reviewer"]
model = "gpt-6-luna"
effortLevel = "medium"

[harnessPolicy.native.copilot.agents."dev-tools:worker"]
model = "gpt-6-luna"
effortLevel = "medium"

[harnessPolicy.native.copilot.agents."factory:verifier"]
model = "gpt-6.1-sol"
effortLevel = "medium"

[harnessPolicy.native.antigravity]
agentMode = "auto"
toolPermission = "always-proceed"
enableTerminalSandbox = false
allowNonWorkspaceAccess = true

[harnessPolicy.native.codex]
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[harnessPolicy.native.pi]
defaultProvider = "openai"
defaultModel = "gpt-5.5"
defaultThinkingLevel = "medium"
packages = [
    "../../.local/share/giocaizzi-harness"
]

[harnessPolicy.native.opencode]
defaultModel = "gpt-5.5"
sandbox = false
