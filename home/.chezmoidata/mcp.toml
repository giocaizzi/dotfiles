# ----------------------------------------------------------------------------
# MCP servers by layer (harness repo-standard, "MCP servers, least privilege").
# Repo servers live in each repo. `${VAR}` in a URL is filled from the
# environment at `chezmoi apply` (secrets.sh, from Bitwarden), so this public
# repo holds no account names; unset, it stays a reference.
# Runbook: docs/OS.md#mcp-servers.
# ----------------------------------------------------------------------------

# User scope, every harness: only servers every repo needs. [mcp.user] reaches
# every machine, [mcp.personal] only personal ones (not work); read both through
# .chezmoitemplates/mcp-user.json.
[mcp.user]

[mcp.personal]
notion = "https://mcp.notion.com/mcp"

# Workspace folder ~/ops (personal machines): personal servers tied to no repo.
# A server whose authorization server needs a pre-registered OAuth client is an
# inline table { url, client_id, callback_port } (both OAuth keys required, ~/ops
# only); its client secret is set once per machine and harness, never here.
[mcp.ops]
firefly = "https://mcp-connector-firefly.${MCP_CONNECTOR_ACCOUNT}.workers.dev/mcp"
firefly-admin = "https://mcp-connector-firefly.${MCP_CONNECTOR_ACCOUNT}.workers.dev/mcp?toolset=admin"
grafana = "https://mcp-connector-grafana.${MCP_CONNECTOR_ACCOUNT}.workers.dev/mcp"
greenhouse = "https://mcp-connector-greenhouse.${MCP_CONNECTOR_ACCOUNT}.workers.dev/mcp"
n8n = "https://mcp-connector-n8n.${MCP_CONNECTOR_ACCOUNT}.workers.dev/mcp"
netdata = "https://mcp-connector-netdata.${MCP_CONNECTOR_ACCOUNT}.workers.dev/mcp"
portainer = "https://mcp-connector-portainer.${MCP_CONNECTOR_ACCOUNT}.workers.dev/mcp"
# Google Workspace: one pre-registered OAuth client serves every server.
# Disabled for now: the Google Workspace MCP servers are in Developer Preview and need an enrolled project.
# google-calendar = { url = "https://calendarmcp.googleapis.com/mcp/v1", client_id = "${MCP_GOOGLE_CLIENT_ID}", callback_port = 8765 }
# google-docs = { url = "https://docsmcp.googleapis.com/mcp/v1", client_id = "${MCP_GOOGLE_CLIENT_ID}", callback_port = 8765 }
# google-drive = { url = "https://drivemcp.googleapis.com/mcp/v1", client_id = "${MCP_GOOGLE_CLIENT_ID}", callback_port = 8765 }
# google-gmail = { url = "https://gmailmcp.googleapis.com/mcp/v1", client_id = "${MCP_GOOGLE_CLIENT_ID}", callback_port = 8765 }
# google-sheets = { url = "https://sheetsmcp.googleapis.com/mcp/v1", client_id = "${MCP_GOOGLE_CLIENT_ID}", callback_port = 8765 }
