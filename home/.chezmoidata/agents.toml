# ==============================================================================
# CANONICAL AI HARNESS POLICY & RUNTIME CONFIGURATION
# Standardized across Claude Code, Copilot CLI, VS Code, Codex, OpenCode, Pi, Antigravity
# Reference: docs/OS.md#shared-harness-policy
# ==============================================================================

# --- D1: Runtime & Autonomy ---
[agents.autonomy]
executionMode = "auto"             # "auto" | "on-request" | "prompt"
sandboxMode = "unrestricted"       # "workspace-write" | "unrestricted"
allowNonWorkspaceAccess = true
subagentDepth = 2
allowSubagentInvocations = true
askTimeout = "60s"
mode = "auto"

# --- D2: Permissions & Security (Universal ACL) ---
[agents.permissions]
allowCommands = [
    "git *",
    "gh *",
    "make *",
    "uv *",
    "jq *",
    "npm *",
    "cargo *",
    "go *",
    "chezmoi *"
]

allowedUrls = [
    "https://github.com/**",
    "https://api.github.com/**",
    "https://docs.github.com/**",
    "https://learn.microsoft.com/**",
    "https://*.chezmoi.io/**",
    "https://*.claude.ai/**",
    "https://*.claude.com/**",
    "https://docs.anthropic.com/**",
    "https://*.openai.com/**",
    "https://*.google.com/**",
    "https://unifiedharnessprotocol.org/**"
]

denyRead = [
    "**/.env",
    "**/.env.local",
    "**/.env.*.local",
    "**/.env.development",
    "**/.env.production",
    "**/.env.staging",
    "**/.env.test",
    "**/secrets/**",
    "~/.config/shell/secrets.sh",
    "~/.config/powershell/secrets.ps1",
    "**/*.pem",
    "**/*.key",
    "**/*.p12",
    "**/*.pfx",
    "**/id_rsa*",
    "**/id_ed25519*",
    "**/.aws/credentials",
    "**/.aws/config",
    "**/.ssh/**",
    "**/.netrc",
    "**/.npmrc",
    "**/.pypirc",
    "**/credentials.json",
    "**/service-account*.json",
    "**/gcp-key*.json",
    "**/*.kubeconfig",
    "**/kubeconfig"
]

denyWrite = [
    "**/.env",
    "**/.env.local",
    "**/.env.*.local",
    "**/.env.development",
    "**/.env.production",
    "**/.env.staging",
    "**/.env.test",
    "**/secrets/**",
    "~/.config/shell/secrets.sh",
    "~/.config/powershell/secrets.ps1",
    "**/.aws/credentials",
    "**/.ssh/**"
]

# Lease pushes are allowed only to feature branches: the allow pattern covers any
# branch and the deny patterns below take it back for main and master. The guard
# hook and the server ruleset stay the real protection; these patterns do not see
# `git -C`, refspec or reordered forms.
allowCommandPatterns = [
    "git push --force-with-lease origin *"
]

denyCommandPatterns = [
    "gh pr merge * --admin*",
    "git push --force-with-lease origin main",
    "git push --force-with-lease origin main *",
    "git push --force-with-lease origin master",
    "git push --force-with-lease origin master *",
    "git push * HEAD:main",
    "git push * HEAD:main *",
    "git push * HEAD:master",
    "git push * HEAD:master *"
]

denyCommandExact = [
    "env"
]

denyCommandPrefixes = [
    "printenv",
    "pipx",
    "pip",
    "pip3",
    "python -m pip",
    "python3 -m pip"
]

askCommandPrefixes = [
    "bw"
]

# --- D3: Models & Reasoning Tiers ---
[agents.models]
defaultEffortLevel = "medium"      # "low" | "medium" | "high"
showThinkingSummaries = true

[agents.models.tiers.scout]
model = "gpt-6-luna"
effort = "low"

[agents.models.tiers.worker]
model = "gpt-6-luna"
effort = "medium"

[agents.models.tiers.driver]
model = "gpt-6.1-sol"
effort = "medium"

[agents.models.tiers.escalate]
model = "gpt-6-astra"
effort = "medium"

# --- D4: Context & Compaction ---
[agents.context]
autoCompact = true
autoCompactWindow = 500000
promptCacheTtl = "1h"
subagentPromptCacheTtl = "1h"
maxTurnTokens = 32000
maxTokens = 200000

# --- D5: UI, TUI & Notifications ---
[agents.ui]
terminalBell = true
theme = "Catppuccin Mocha"
tuiMode = "fullscreen"
viewMode = "focus"
outputStyle = "Concise"
showTurnDuration = true
progressBar = true
timeFormat = "24h"

[agents.notifications]
terminalBell = true

# --- D6: Telemetry & Observability (Dual-Tier Everywhere) ---
[agents.telemetry]
enabled = true
dualTier = true
protocol = "http/protobuf"
temporality = "cumulative"
logToolDetails = true
logToolContent = false
serviceNamespace = "agent-harness"
attributes = { "deployment.environment.name" = "production", "service.namespace" = "agent-harness" }
services = { claude = "claude-code", copilot = "copilot-cli", vscode = "vscode-copilot", codex = "codex-cli", opencode = "opencode", pi = "pi-agent", antigravity = "antigravity-cli" }
hooksBridge = true

# --- D7: Language Server Protocol (LSP) ---
# One [agents.lsp.server.<name>] per language server, rendered into every
# harness and editor that takes custom servers (.chezmoitemplates/lsp-servers):
#   package    = its row in packages.toml; the server is configured only where that
#                package installs (this machine's role, OS and answers)
#   command    = argv that starts it on stdio
#   extensions = file extension → LSP language ID
#   filetypes  = Vim filetypes, where they differ from the language IDs
#   format     = true: editors format on save with it
# A name equal to an opencode built-in (pyright, typescript, gopls, bash, yaml-ls,
# terraform) replaces that built-in. enabled = false turns LSP off in every consumer.
[agents.lsp]
enabled = true

[agents.lsp.server.pyright]
package = "pyright"
command = ["pyright-langserver", "--stdio"]
extensions = { ".py" = "python", ".pyi" = "python" }

[agents.lsp.server.ruff]
package = "ruff"
command = ["ruff", "server"]
extensions = { ".py" = "python", ".pyi" = "python" }
format = true

# TypeScript 7's compiler is its own language server (tsc --lsp; TS 7 has no tsserver).
[agents.lsp.server.typescript]
package = "typescript"
command = ["tsc", "--lsp", "--stdio"]
extensions = { ".ts" = "typescript", ".mts" = "typescript", ".cts" = "typescript", ".tsx" = "typescriptreact", ".js" = "javascript", ".mjs" = "javascript", ".cjs" = "javascript", ".jsx" = "javascriptreact" }
format = true

[agents.lsp.server.gopls]
package = "gopls"
command = ["gopls"]
extensions = { ".go" = "go" }
format = true

# Lints with shellcheck and formats with shfmt when they are on PATH.
[agents.lsp.server.bash]
package = "bash-language-server"
command = ["bash-language-server", "start"]
extensions = { ".sh" = "shellscript", ".bash" = "shellscript" }
filetypes = ["sh", "bash"]
format = true

[agents.lsp.server.yaml-ls]
package = "yaml-language-server"
command = ["yaml-language-server", "--stdio"]
extensions = { ".yaml" = "yaml", ".yml" = "yaml" }

[agents.lsp.server.json]
package = "vscode-langservers-extracted"
command = ["vscode-json-language-server", "--stdio"]
extensions = { ".json" = "json", ".jsonc" = "jsonc" }

[agents.lsp.server.terraform]
package = "terraform-ls"
command = ["terraform-ls", "serve"]
extensions = { ".tf" = "terraform", ".tfvars" = "terraform-vars" }
format = true

[agents.lsp.server.tflint]
package = "tflint"
command = ["tflint", "--langserver"]
extensions = { ".tf" = "terraform", ".tfvars" = "terraform-vars" }

# --- D8: Native Overrides & Escapes ---
[agents.native.claude]
defaultMode = "auto"
skipAutoPermissionPrompt = true
cleanupPeriodDays = 365
disableClaudeAiConnectors = true

[agents.native.copilot.agents."dev-tools:scout"]
model = "gpt-6-luna"
effortLevel = "low"

[agents.native.copilot.agents."foundations:api-reviewer"]
model = "gpt-6.1-sol"
effortLevel = "medium"

[agents.native.copilot.agents."dev-tools:escalate"]
model = "gpt-6-astra"
effortLevel = "medium"

[agents.native.copilot.agents."dev-tools:driver"]
model = "gpt-6.1-sol"
effortLevel = "medium"

[agents.native.copilot.agents."dev-tools:reviewer"]
model = "gpt-6-luna"
effortLevel = "medium"

[agents.native.copilot.agents."dev-tools:worker"]
model = "gpt-6-luna"
effortLevel = "medium"

[agents.native.antigravity]
agentMode = "auto"
toolPermission = "always-proceed"
enableTerminalSandbox = false
allowNonWorkspaceAccess = true

[agents.native.codex]
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents.native.pi]
defaultProvider = "openai"
defaultModel = "gpt-5.6-terra"
defaultThinkingLevel = "medium"
packages = [
    "../../.local/share/giocaizzi-harness"
]

[agents.native.opencode]
defaultModel = "gpt-5.5"
sandbox = false

# --- D9: Voice input (dictation) ---
# Claude Code: rendered from this table. VS Code: settings.json is static, edit it to match (agents check fails on drift). Others: docs/OS.md#voice-input.
[agents.voice]
enabled = true
mode = "hold"        # "hold" (push-to-talk) | "tap" (toggle)
autoSubmit = false   # send the prompt when recording stops
language = ""   # BCP 47, VS Code only (agents.voice.language); "" = VS Code default "auto"
