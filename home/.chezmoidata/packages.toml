# ----------------------------------------------------------------------------
# Package registry: every tool each machine installs, per OS and role, in one place.
# docs/OS.md#packages
#
# [package.<name>]  installed by the install scripts, which re-run when this file
#                   changes (.chezmoiscripts/run_onchange_after_install-pkgs.*)
#   roles    = machine roles that get it: "personal", "work", "light"
#              (default: ["personal", "work"], i.e. full machines)
#   requires = name of a boolean [data] answer (.chezmoi.toml.tmpl, e.g. "terraform"):
#              selected only when that answer is true (also for [release.*])
#   brew     = Homebrew formula (true: <name>)      cask   = Homebrew cask
#   apt      = apt package (true: <name>)           winget = winget id
#   scope    = "machine" for a winget package with no user-scope installer
#   cmd      = command whose presence skips the winget install (default: <name>)
#   uv       = uv tool (true: <name>)                npm    = npm -g package (true: <name>)
#   az       = Azure CLI extension (true: <name>)    psmodule = PowerShell module, minimum version
#   python   = Python version installed by uv as the global python
#   ompFont  = Nerd Font archive installed per user by oh-my-posh (Windows), with
#              fontFile, the file that marks it installed
#   agents   = true: named to AI agents as available (agent instructions, env layer)
#   script   = OSes where the install script has its own step for it (an official
#              installer or a repo to add); the step is named after <name>
#   versionCmd = argv that prints the installed version, for `chezmoi dots outdated`
#              (the first dotted number is the version; default ["<cmd or name>", "--version"])
#
# [release.<name>]  a binary from a release page, installed by chezmoi itself as an
#                   external (.chezmoiexternal.toml.tmpl) and verified by checksum
#   version  = pinned version          url = download URL, {version} and {target} expanded
#   target   = "<os>/<arch>" → the release's name for that platform; only these get it
#   sha256   = "<os>/<arch>" → checksum of the download (chezmoi verifies it)
#   type     = external type (default "archive-file"; "file" for a bare binary,
#              "archive" for a tree)
#   path     = the binary inside an archive-file (default: <name>); {version} and {target} expanded
#   dest     = target, home-relative (default: .local/bin/<name>)
#   exe      = true: ".exe" is appended to path and dest on Windows
#   stripComponents = archive path components to drop
#   roles, requires = as above
#   versionCmd = as above; {dest} expands to the installed path (default ["{dest}", "--version"])
#
# Update: `chezmoi dots outdated` shows every tool with its installed, pinned and latest
# versions, `chezmoi dots bump` rewrites release versions and checksums here
# (docs/OS.md#packages).
# ----------------------------------------------------------------------------

# --- Core: every machine ---
[package.fzf]
agents = true
roles = ["personal", "work", "light"]
brew = true
apt = true
winget = "junegunn.fzf"

[package.git]
roles = ["personal", "work", "light"]
brew = true
apt = true
winget = "Git.Git"

[package.vim]
roles = ["personal", "work", "light"]
brew = true
apt = true
winget = "vim.vim"

[package.fd]
agents = true
roles = ["personal", "work", "light"]
brew = true
apt = "fd-find" # linked to ~/.local/bin/fd by the install script
winget = "sharkdp.fd"

[package.tmux]
agents = true
roles = ["personal", "work", "light"]
brew = true
apt = true

[package.jq]
agents = true
roles = ["personal", "work", "light"]
brew = true
apt = true
winget = "jqlang.jq"

[package.shellcheck]
roles = ["personal", "work", "light"]
brew = true
apt = true
winget = "koalaman.shellcheck"

[package.shfmt]
roles = ["personal", "work", "light"]
brew = true
apt = true
winget = "mvdan.shfmt"

[package.oh-my-posh]
roles = ["personal", "work", "light"]
brew = true
script = ["linux"] # official installer into ~/.local/bin
winget = "JanDeDobbeleer.OhMyPosh"

[package.curl]
roles = ["personal", "work", "light"]
apt = true

[package.make]
agents = true
roles = ["personal", "work", "light"]
apt = true # macOS gets it from the Xcode CLT that Homebrew needs
winget = "ezwinports.make"

[package.python3-pip]
roles = ["personal", "work", "light"]
apt = true

[package.pwsh]
agents = true
roles = ["personal", "work", "light"]
winget = "Microsoft.PowerShell"

[package.coreutils]
roles = ["personal", "work", "light"]
winget = "uutils.coreutils"
cmd = "ls.exe" # the exe, not PowerShell's ls alias

[package.PSReadLine]
roles = ["personal", "work", "light"]
psmodule = "2.2.0"

[package.PSFzf]
roles = ["personal", "work", "light"]
psmodule = "2.5.0"

# --- Full machines ---
[package.gh]
agents = true
brew = true
apt = true
script = ["linux"] # adds GitHub's apt repository first
winget = "GitHub.cli"

[package.zsh-autosuggestions]
brew = true

[package.bash-completion]
apt = true

[package.ripgrep]
agents = true
winget = "BurntSushi.ripgrep.MSVC"
cmd = "rg"

[package.jetbrains-mono-nerd-font]
cask = "font-jetbrains-mono-nerd-font" # Linux: the font external
ompFont = "JetBrainsMono"
fontFile = "JetBrainsMonoNerdFont-Regular.ttf"

[package.uv]
agents = true
brew = true
script = ["linux", "windows"] # official installer into ~/.local/bin

[package.python]
python = "3.13"

[package.node]
brew = true
script = ["linux"] # NodeSource LTS: apt's nodejs is too old for the language servers
winget = "OpenJS.NodeJS.LTS"

[package.gitleaks]
agents = true
brew = true
winget = "Gitleaks.Gitleaks"

[package.actionlint]
agents = true
brew = true
winget = "rhysd.actionlint"

[package.hadolint]
agents = true
brew = true
winget = "hadolint.hadolint"

[package.pyright]
uv = true

[package.typescript]
npm = true

[package.ruff]
uv = true

[package.bash-language-server]
npm = true

[package.yaml-language-server]
npm = true

[package.vscode-langservers-extracted]
npm = true # provides vscode-json-language-server

# Terraform tooling, only where the `terraform` init answer is yes. Linux gets the
# binaries from the releases below.
[package.terraform]
requires = "terraform"
brew = "hashicorp/tap/terraform"
winget = "Hashicorp.Terraform"

[package.terraform-ls]
requires = "terraform"
versionCmd = ["terraform-ls", "version"]
brew = true
winget = "Hashicorp.TerraformLanguageServer"

[package.tflint]
requires = "terraform"
cask = "terraform-linters/tap/tflint"
winget = "TerraformLinters.tflint"

[package.PSScriptAnalyzer]
psmodule = "1.22.0"

# --- Personal machines ---
[package.bitwarden-cli]
roles = ["personal"]
brew = true

[package.go]
roles = ["personal"]
brew = true

[package.golangci-lint]
roles = ["personal"]
brew = true

[package.gopls]
roles = ["personal"]
versionCmd = ["gopls", "version"]
brew = true
script = ["linux"] # go install, with the Go release below

[package.goreleaser]
roles = ["personal"]
brew = true
winget = "goreleaser.goreleaser"

[package.syft]
roles = ["personal"]
brew = true
winget = "Anchore.Syft"

# --- Work machines ---
[package.glab]
agents = true
roles = ["work"]
brew = true
winget = "GLab.GLab"

[package.az]
agents = true
roles = ["work"]
brew = "azure-cli"
script = ["linux"] # Microsoft's apt repository setup
winget = "Microsoft.AzureCLI"
scope = "machine"

[package.azure-devops]
roles = ["work"]
az = true

