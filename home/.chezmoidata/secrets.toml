# ----------------------------------------------------------------------------
# Secrets registry: the secret managers the templates read; it holds no secret values.
# `chezmoi dots lint secrets` validates it, `chezmoi dots audit secrets` probes each entry
# read-only, `chezmoi dots secrets run <name> -- <args>` runs its CLI with the token from
# the OS keyring. Schema: https://github.com/giocaizzi/chezmoi-dots/blob/main/docs/secrets.md
# ----------------------------------------------------------------------------

# Bitwarden Secrets Manager: renders the env secrets files (.chezmoitemplates/bws-secrets.json;
# docs/OS.md#bitwarden). The project ID is this machine's bwsProjectId answer (blank = off),
# the token sits in the OS keyring. bws is the pinned release in ~/.local/bin, named by
# path since PATH may lack that directory during chezmoi apply (bws.exe on Windows).
[secret.bws]
kind = "bws"
projectFrom = "bwsProjectId"
keyring = { service = "bws", user = "access-token" }
command = "~/.local/bin/bws"
