# tmux >= 3.1 reads this XDG path natively.
# Prefix stays C-b: Ghostty already uses ctrl+a (splits) and ctrl+h/j/k/l.

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Keep bells audible through the outer terminal; show activity without ringing.
set -g bell-action any
set -g visual-bell off
set -g visual-activity on
set -g activity-action other
setw -g monitor-bell on
setw -g monitor-activity on

# Pane navigation (prefix + h/j/k/l) and splits in the current directory
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Catppuccin Mocha tokens (see AGENTS.md style system); background follows the terminal
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-interval 5
set -g status-left "#[fg=#89b4fa]└#[fg=#6c7086] [#[fg=#cdd6f4]󰆍 #S#[fg=#6c7086]] "
set -g status-right-length 200
set -g status-right "#[fg=#6c7086][#[fg=#cdd6f4]󰆍 #h#[fg=#6c7086]] #[fg=#6c7086][#[fg=#cdd6f4]󰍛 #{window_panes}#[fg=#6c7086]]#(sh ~/.config/tmux/status-right.sh) #[fg=#6c7086][#[fg=#cdd6f4]󰥔 %H:%M#[fg=#6c7086]] "
setw -g window-status-format "#[fg=#6c7086] #I:#W#{?window_activity_flag,#[fg=#f9e2af,bold]+,}#{?window_bell_flag,#[fg=#f38ba8,bold]!,}#[fg=#6c7086] "
setw -g window-status-current-format "#[fg=#6c7086] #[fg=#cba6f7,bold]#I:#W#{?window_activity_flag,#[fg=#f9e2af,bold]+,}#{?window_bell_flag,#[fg=#f38ba8,bold]!,}#[fg=#6c7086] "
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=default,fg=#f9e2af"
set -g mode-style "bg=#6c7086,fg=#cdd6f4"

# Support extended keyboard key encoding (for key combinations)
set -g extended-keys on

