name: bump-releases

# Weekly: pin newer versions of the release binaries in .chezmoidata/packages.toml
# (`chezmoi dots bump`) and open a PR. Set the BUMP_TOKEN secret (a token that may open
# PRs) so CI runs on that PR; without it the PR is opened with GITHUB_TOKEN and its
# checks must be started by hand.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install chezmoi-dots
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gh release download -R giocaizzi/chezmoi-dots -p "chezmoi-dots_*_linux_amd64" -O "$HOME/.local/bin/chezmoi-dots" --clobber
          chmod +x "$HOME/.local/bin/chezmoi-dots"
        env:
          GH_TOKEN: ${{ github.token }}
      # bump reads the release table with `chezmoi data`; same pin as ci.yml.
      - run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.70.0
      - name: Bump
        env:
          CHEZMOI_SOURCE_DIR: ${{ github.workspace }}/home
        run: chezmoi-dots bump
      - name: Open the PR
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
        run: |
          set -eu
          git diff --quiet && { echo "Everything is up to date."; exit 0; }
          branch=chore/bump-releases
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Checkout keeps no credential; only this step gets the token, for git through gh.
          gh auth setup-git
          git switch -c "$branch"
          git commit -am "chore(deps): bump pinned release binaries"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(deps): bump pinned release binaries" \
            --body "Versions and checksums from \`chezmoi dots bump\`. See docs/OS.md#packages." \
            || gh pr edit "$branch" --body "Versions and checksums from \`chezmoi dots bump\`. See docs/OS.md#packages."
