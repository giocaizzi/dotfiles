name: bump-releases

# Weekly: pin newer versions of the release binaries in .chezmoidata/packages.toml and of
# the commit-pinned archive externals (`chezmoi dots pkg bump`) and open a PR, through the
# chezmoi-dots pkg-bump action (docs/CI.md). Set the BUMP_TOKEN secret (a token that may
# open PRs) so CI runs on that PR; without it the PR is opened with GITHUB_TOKEN and its
# checks must be started by hand. Keep this job to the checkout and the action: only the
# action's last step gets the token.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # `version` must equal the release in the ref comment: move both together.
      - uses: giocaizzi/chezmoi-dots/.github/actions/pkg-bump@85d96977094d4862d60b804b6b87627108637adc # v0.4.1
        with:
          version: 0.4.1
          source-dir: home
          token: ${{ secrets.BUMP_TOKEN || github.token }}
