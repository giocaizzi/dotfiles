name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Required status check: aggregates checks and runs make check.
  check:
    needs: [gitleaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - run: |
          go install github.com/giocaizzi/chezmoi-dots/cmd/chezmoi-dots@latest
          go install github.com/giocaizzi/agents/cmd/agents@latest
          ln -sf $(go env GOPATH)/bin/agents $(go env GOPATH)/bin/chezmoi-agents
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get install -y --no-install-recommends zsh
      # make lint renders the script templates with chezmoi.
      - run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.70.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make check
        env:
          GH_TOKEN: ${{ github.token }}  # the plugins check reads giocaizzi/harness plugins/
