name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Required status check: aggregates checks and runs make check.
  check:
    needs: [gitleaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends zsh
      # Pinned chezmoi, chezmoi-dots and agents (docs/CI.md); make lint renders templates with chezmoi.
      - run: make tools
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make check
