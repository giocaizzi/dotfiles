name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Required status check: aggregates gitleaks and runs make check.
  check:
    needs: [gitleaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs
        if: needs.gitleaks.result != 'success'
        run: exit 1
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends zsh
      - run: make check
