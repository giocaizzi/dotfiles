name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Required status check: aggregates gitleaks and runs make check.
  check:
    needs: [gitleaks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs
        if: needs.gitleaks.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends zsh
      # make lint renders the script templates with chezmoi.
      - run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.70.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make check
