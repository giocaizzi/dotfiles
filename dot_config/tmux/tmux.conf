# tmux >= 3.1 reads this XDG path natively.
# Prefix stays C-b: Ghostty already uses ctrl+a (splits) and ctrl+h/j/k/l.

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Pane navigation (prefix + h/j/k/l) and splits in the current directory
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Catppuccin Mocha tokens (see AGENTS.md style system); background follows the terminal
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left "#[fg=#89b4fa,bold] #S #[default]"
set -g status-right "#[fg=#6c7086]#H "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W "
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=default,fg=#f9e2af"
set -g mode-style "bg=#6c7086,fg=#cdd6f4"
